# Local hybrid-dev gateway config.
# Used by docker-compose.local.yml when the API, LabRpcServer, and Angular
# dev-server are running on the host machine instead of inside containers.
# Upstreams therefore point at host.docker.internal rather than sibling
# container names.

upstream api_service {
    server host.docker.internal:5000;
}

upstream lab_service {
    server host.docker.internal:5100;
}

upstream web_service {
    server host.docker.internal:4200;
}

server {
    listen 80;
    server_name localhost;

    location /api/ {
        proxy_pass         http://api_service;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /notifications {
        proxy_pass         http://api_service;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /lab/ {
        proxy_pass         http://lab_service/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Angular dev server (ng serve). HMR uses a WebSocket so Upgrade/Connection
    # must be proxied; without these the live-reload channel silently fails.
    location / {
        proxy_pass         http://web_service;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
